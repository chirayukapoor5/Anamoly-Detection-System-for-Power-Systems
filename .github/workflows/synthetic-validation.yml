name: Synthetic anomaly validation
on:
  push:
    paths:
      - "producer/producer-3.py"
      - "validation/**"
      - ".github/workflows/synthetic-validation.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependency
        run: python -m pip install scikit-learn==1.8.0
      - name: Run deterministic validation and export metrics
        run: python validation/validate.py --samples 4000 --seed 42 --output validation/metrics.json
      - name: Verify metric consistency
        run: python -m unittest discover -s validation -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-anomaly-metrics
          path: validation/metrics.json
